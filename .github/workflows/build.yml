name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Собрать APK
        id: assemble
        continue-on-error: true
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Отправить ошибку в Issue
        if: steps.assemble.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Ошибка сборки. Строки с ошибками:"
            echo '```'
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by:|Execution failed|FAILED" build.log | head -60 || true
            echo '```'
            echo
            echo "Хвост лога:"
            echo '```'
            tail -60 build.log
            echo '```'
          } > body.md
          gh issue create --title "Ошибка сборки APK" --body-file body.md || true

      - name: Уронить сборку, если не собралось
        if: steps.assemble.outcome == 'failure'
        run: exit 1

      - name: Отдать APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nixi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
