name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Найти APK и показать пути
        if: always()
        run: |
          echo "=== Все apk в проекте ==="
          find . -name "*.apk" -type f || true
          echo "=== Папки outputs ==="
          find . -type d -path "*outputs*" || true
          echo "=== Содержимое outputs/apk ==="
          find . -type d -name "apk" -exec ls -la {} \; || true

      - name: Отдать APK
        uses: actions/upload-artifact@v4
        with:
          name: nixi-debug-apk
          path: "**/*.apk"
          if-no-files-found: error
